include classpath("application.conf")

# Queue URLs returned to clients use this address (the compose service name).
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  imports {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    # Same semantics as an SQS redrive policy: after 3 receives the message moves to the DLQ.
    deadLettersQueue {
      name = "imports-dlq"
      maxReceiveCount = 3
    }
  }
  imports-dlq {
    defaultVisibilityTimeout = 60 seconds
  }
}
